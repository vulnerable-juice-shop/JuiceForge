services:
  app:
    build: .
    image: juiceshop-fixed:1.0
    expose:
      - "3000"
    environment:
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env file}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

networks:
  internal: